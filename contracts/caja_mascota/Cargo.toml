[package]
name = "caja-mascota"
description = "CajaMascota: cajita de ahorro de una mascota que solo paga a veterinarias verificadas con consulta registrada (Soroban, Stellar)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
